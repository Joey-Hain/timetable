name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_build.py
      - run: node -e "new Function(require('fs').readFileSync('site/app.js','utf8'))"
      - run: node -e "new Function(require('fs').readFileSync('site/graph.js','utf8'))"
