name: Probe feeds
on:
  workflow_dispatch:
    inputs:
      paths:
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe
        env:
          TFNSW_KEY: ${{ secrets.TFNSW_KEY }}
        run: python tools/probe.py ${{ github.event.inputs.paths }} 2>&1 | tee probe.txt
      - name: Publish output to the diag branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cd pub && git init -q -b diag
          cp ../probe.txt .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m probe
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:diag
